# Production on the VPS:
#   docker compose -f docker-compose.yml -f compose.prod.yml up -d --build
# Only Caddy faces the internet (80/443, automatic HTTPS). The website and the
# POS / Admin app listen on 127.0.0.1 only (set WEB_PORT / APP_PORT in .env).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      WWW_ADDRESS: ${WWW_ADDRESS:-http://www.invalid}
      APP_ADDRESS: ${APP_ADDRESS:-http://pos.invalid}
    volumes:
      # Mount the folder, not the file, so an updated Caddyfile is seen after upload.
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - app

  # Uptime monitor: checks the site, POS, API/database/Redis, HTTPS certificates and disk
  # every minute and emails MONITOR_ALERT_TO on problems and recovery (api/src/scripts/monitor.ts).
  monitor:
    build: ./api
    restart: unless-stopped
    command: ["node", "dist/scripts/monitor.js"]
    environment:
      MONITOR_ALERT_TO: ${MONITOR_ALERT_TO:-}
      MONITOR_SITE_URL: ${MONITOR_SITE_URL:-https://nampani.ink/}
      MONITOR_POS_URL: ${MONITOR_POS_URL:-https://pos.nampani.ink}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Nampani Ink <booking@nampani.ink>}
    healthcheck:
      disable: true
    depends_on:
      - caddy

volumes:
  caddy_data:
  caddy_config:
